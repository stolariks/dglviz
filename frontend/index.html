<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DGLViz</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="sidebar-header">
          <span class="logo">DGLViz</span>
        </header>
        <div id="sidebar-body">
          <section id="files-section" class="panel"></section>
          <div id="graph-controls" style="display:none"></div>
        </div>
      </aside>

      <main id="viewport">
        <canvas id="canvas"></canvas>

        <div id="overlay">
          <div id="stats-bar"></div>
          <div id="colorbar" style="display:none">
            <div id="colorbar-max" class="cb-label"></div>
            <canvas id="colorbar-canvas" width="16" height="180"></canvas>
            <div id="colorbar-min" class="cb-label"></div>
            <div id="colorbar-title" class="cb-title"></div>
          </div>
          <div id="edge-colorbar" style="display:none">
            <div id="edge-colorbar-max" class="cb-label"></div>
            <canvas id="edge-colorbar-canvas" width="16" height="180"></canvas>
            <div id="edge-colorbar-min" class="cb-label"></div>
            <div id="edge-colorbar-title" class="cb-title"></div>
          </div>
        </div>

        <div id="loading-overlay" style="display:none">
          <div class="spinner"></div>
          <span id="loading-text">Loading…</span>
        </div>
      </main>
    </div>

    <div id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
